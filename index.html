<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de charge Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan : une piste d'athlétisme. Bandeau marine avec 7 couloirs (les 7 derniers jours),
   contenu en une colonne étroite pour l'athlète, large pour le coach. L'audace est dans le bandeau, le reste est calme. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#101B33; --ink-2:#4A5672; --line:#D5DBE6;
  --accent:#2146D0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB; --gold:#B87A00; --gold-fill:#F2B134;
  --good:#16845B; --warn:#A86200; --crit:#C2362B;
  --good-soft:#DDF3EA; --warn-soft:#FBEBCF; --crit-soft:#FADFDB; --info-soft:#E6EAF2;
  --track:#101B33; --track-ink:#F4F6FB; --track-line:rgba(255,255,255,.22);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A101F; --surface:#141D33; --ink:#E9EDF6; --ink-2:#9AA6C0; --line:#28334F;
    --accent:#8AA2FF; --accent-ink:#0A101F; --accent-soft:#1D2A52; --gold:#F2B845; --gold-fill:#F2B845;
    --good:#44CF98; --warn:#F0A93B; --crit:#FF8274;
    --good-soft:#123528; --warn-soft:#3A2A0C; --crit-soft:#431A16; --info-soft:#1C2640;
    --track:#060B17; --track-ink:#F4F6FB; --track-line:rgba(255,255,255,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A101F; --surface:#141D33; --ink:#E9EDF6; --ink-2:#9AA6C0; --line:#28334F;
  --accent:#8AA2FF; --accent-ink:#0A101F; --accent-soft:#1D2A52; --gold:#F2B845; --gold-fill:#F2B845;
  --good:#44CF98; --warn:#F0A93B; --crit:#FF8274;
  --good-soft:#123528; --warn-soft:#3A2A0C; --crit-soft:#431A16; --info-soft:#1C2640;
  --track:#060B17; --track-ink:#F4F6FB; --track-line:rgba(255,255,255,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* Bandeau piste */
.track{background:var(--track);color:var(--track-ink)}
.track-in{max-width:1080px;margin:0 auto;padding:14px 16px 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;opacity:.7;margin-top:2px}
.top .sp{flex:1}
.stat{display:flex;align-items:baseline;gap:6px;border:1px solid var(--track-line);border-radius:999px;padding:4px 12px;font-size:13px}
.stat b{font-family:var(--display);font-size:22px;line-height:1}
.stat.gold b{color:#F2B845}
.lanes{display:grid;grid-template-columns:repeat(7,1fr);margin-top:14px;border-top:2px solid var(--track-ink)}
.lane{background:none;border:0;border-left:1px solid var(--track-line);color:inherit;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lane:first-child{border-left:0}
.lane .d{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.lane .n{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.lane .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--track-line);display:grid;place-items:center;font-size:12px;font-weight:700}
.lane.done .dot{background:#F2B845;border-color:#F2B845;color:#101B33}
.lane.sel{background:rgba(255,255,255,.1);box-shadow:inset 0 -4px 0 #F2B845}
.lane.today .d{opacity:1;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{background:none;border:0;color:var(--track-ink);opacity:.7;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-bottom:4px solid transparent}
.tab[aria-current="page"]{opacity:1;border-bottom-color:var(--track-ink)}

main{max-width:600px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1080px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h .lane-no{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);line-height:1}
.card-h .sp{flex:1}
.pts{font-size:13px;font-weight:600;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:1px 9px;white-space:nowrap}
.note{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--info-soft)}
.note.warn{background:var(--warn-soft)} .note.crit{background:var(--crit-soft)} .note.good{background:var(--good-soft)}
.note b{font-weight:600}

/* Échelles */
.q{display:flex;flex-direction:column;gap:6px}
.q-l{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q-l b{font-weight:600}
.q-l span{font-size:13px;color:var(--ink-2);text-align:right}
.sl{display:flex;align-items:center;gap:10px}
.sl .end{background:none;border:0;padding:4px;font-size:28px;line-height:1;border-radius:10px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sl input[type=range]{flex:1;min-width:0;height:36px;margin:0;accent-color:var(--accent);cursor:pointer}
.sl.hot input[type=range]{accent-color:var(--crit)}
.sl.unset input[type=range]{opacity:.45;filter:grayscale(1)}
.q-l .picked.none{font-weight:400;color:var(--ink-2);font-size:13px}
.q-l .picked .pe{font-size:22px;line-height:1;vertical-align:-3px;margin-right:6px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.q-l .picked{color:var(--ink);font-weight:600;font-size:15px}
.q-l .picked i{font-style:normal;font-weight:400;color:var(--ink-2);font-size:12px;margin-left:4px}
.recaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.recap{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.25;background:var(--bg);border-radius:10px;padding:8px 10px}
.recap .e{font-size:26px;line-height:1}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.field.n{width:90px;font-family:var(--display);font-size:19px;font-weight:600}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 18px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line);font-size:16px;padding:8px 14px}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--crit);font-size:16px;padding:8px 14px}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:15px}
details[open] summary{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Signal du jour */
.signal{display:flex;gap:16px;align-items:center}
.signal .big{font-size:56px;line-height:.9}
.signal .big small{font-size:22px;color:var(--ink-2);font-weight:600}
.sess{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.sess .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--info-soft);color:var(--ink)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.pill.good::before{background:var(--good)} .pill.good{background:var(--good-soft)}
.pill.warn::before{background:var(--warn);border-radius:2px} .pill.warn{background:var(--warn-soft)}
.pill.crit::before{background:var(--crit);border-radius:0;transform:rotate(45deg)} .pill.crit{background:var(--crit-soft)}

/* Progrès */
.bar{height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-fill);border-radius:999px}
.bar.acc i{background:var(--accent)}
.lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl .name{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;line-height:1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.badge.on{opacity:1;border-color:var(--gold-fill);box-shadow:inset 4px 0 0 var(--gold-fill)}
.badge b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.badge span{font-size:13px;color:var(--ink-2)}
.wk{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.wk .v{text-align:right}

/* Coach */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .num{font-size:40px;line-height:1}
.tile .num small{font-size:20px;color:var(--ink-2)}
.ath{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,2fr) 150px;gap:12px;align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ath .nm{font-weight:600;font-size:17px}
.ath .flags{display:flex;flex-wrap:wrap;gap:5px}
.ath .mt{font-size:13px;color:var(--ink-2)}
.ath svg{width:150px;height:36px;display:block}
.ath[aria-expanded="true"] .nm{color:var(--accent)}
.detail{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.chart h4{margin:0 0 6px;font-size:14px;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--ink-2);border-top:0}
.scroll{overflow-x:auto}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 9px;border-radius:6px;display:none;max-width:240px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--track);color:#F2B845;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;padding:10px 20px;border-radius:999px;border:2px solid #F2B845;transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:10;white-space:nowrap}
#toast{opacity:0}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:720px){
  .ath{grid-template-columns:1fr}
  .ath svg{width:100%}
  .brand{font-size:26px}
  
}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="status"></div>
<div id="toast" aria-live="polite"></div>
<script>
"use strict";
/* ---------- Outils ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toDate = k => { const p = k.split("-").map(Number); return new Date(p[0], p[1]-1, p[2], 12); };
const addDays = (k,n) => { const d = toDate(k); d.setDate(d.getDate()+n); return dkey(d); };
const today = () => dkey(new Date());
const monday = k => addDays(k, -((toDate(k).getDay()+6)%7));
const WD = ["dim","lun","mar","mer","jeu","ven","sam"];
const fmtDay = k => { const d = toDate(k); return WD[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1); };
const fr = n => Math.round(n).toLocaleString("fr-BE");
const fr2 = n => n.toFixed(2).replace(".",",");
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Contenu ---------- */
const HOOPER = [
  {k:"sl", l:"Sommeil", a:"très bon", b:"très mauvais"},
  {k:"fa", l:"Fatigue", a:"aucune", b:"très forte"},
  {k:"st", l:"Stress", a:"aucun", b:"très fort"},
  {k:"so", l:"Courbatures", a:"aucune", b:"très fortes"}
];
const SC = {
  c:{
    sl:[["😇","Nuit parfaite"],["😊","Très bien dormi"],["🙂","Bien dormi"],["😐","Correct"],["🥱","Pas assez dormi"],["😩","Mal dormi"],["🧟","Nuit blanche"]],
    fa:[["⚡","Plein·e d'énergie"],["😄","En forme"],["🙂","Plutôt bien"],["😐","Un peu fatigué·e"],["🥱","Fatigué·e"],["😫","Très fatigué·e"],["🪫","À plat"]],
    st:[["😌","Zen"],["🙂","Tranquille"],["😐","Quelques soucis"],["😕","Un peu tendu·e"],["😟","Stressé·e"],["😰","Très stressé·e"],["🤯","Débordé·e"]],
    so:[["🤸","Aucune"],["🙂","À peine"],["😐","Légères"],["😬","Présentes"],["😣","Marquées"],["😖","Fortes"],["😵","Tout fait mal"]],
    pain:[["😀","Aucune"],["🙂","À peine"],["😐","Légère"],["😕","Gênante"],["😟","Modérée"],["😣","Franche"],["😖","Forte"],["😫","Très forte"],["😩","Intense"],["😭","Presque insupportable"],["🆘","Maximale"]],
    mood:[["😞","Pas bien"],["😕","Bof"],["😐","Moyen"],["🙂","Bien"],["😁","Au top"]]
  },
  s:{
    rpe:[["🛋️","Repos"],["🚶","Très, très léger"],["🙂","Léger"],["😊","Modéré"],["😅","Un peu dur"],["😤","Dur"],["😓","Dur, ça pique"],["🥵","Très dur"],["😫","Très, très dur"],["😵","Extrêmement dur"],["💀","Maximal"]],
    fun:[["😒","Aucun"],["😐","Bof"],["🙂","Correct"],["😄","Bien"],["🤩","Génial"]],
    men:[["😌","Léger"],["🙂","Facile"],["🤔","Concentration"],["😣","Exigeant"],["🤯","Épuisant"]],
    pain:null
  }
};
SC.s.pain = SC.c.pain;
const MOODS = ["Pas bien","Bof","Moyen","Bien","Au top"];
const TYPES = {train:"Entraînement", comp:"Compétition", gym:"Muscu / prépa", cross:"Autre sport", rest:"Repos"};
const RPE = ["Repos","Très, très léger","Léger","Modéré","Un peu dur","Dur","Dur","Très dur","Très dur","Extrêmement dur","Maximal"];
const LEVELS = [[0,"Vestiaire"],[40,"Échauffement"],[120,"Ligne de départ"],[250,"Foulée"],[450,"Relais"],[700,"Dernier virage"],[1000,"Finale"],[1400,"Podium"]];
const MYTHS = [
  {id:"m1", q:"Il faut 10 000 heures d'entraînement pour atteindre l'élite.", t:false, e:"Le temps d'entraînement n'est qu'un facteur parmi d'autres. Les besoins changent selon l'athlète et le sport, et pratiquer plusieurs sports aide aussi à progresser."},
  {id:"m2", q:"Des courbatures 12 à 48 h après une séance inhabituelle, c'est normal.", t:true, e:"Elles peuvent durer 2 à 5 jours et ne présentent pas de danger. Une douleur qui revient ou qui dure, c'est autre chose : parles-en."},
  {id:"m3", q:"Augmenter sa charge de 10 % par semaine est une règle à suivre à la lettre.", t:false, e:"C'est un repère, pas une règle. Chaque athlète réagit différemment selon son énergie et ce qu'il ou elle vit en dehors du sport."},
  {id:"m4", q:"No pain, no gain : la douleur fait partie du jeu.", t:false, e:"Pendant l'effort, la douleur ne devrait pas dépasser 3 sur 10. Adapter ou arrêter une séance est normal, et la douleur n'est jamais un outil de motivation."},
  {id:"m5", q:"Bien dormir aide à supporter une charge qui augmente.", t:true, e:"Le sommeil soutient la récupération et la progression. Le besoin de sommeil varie d'une personne à l'autre."},
  {id:"m6", q:"Une blessure vient toujours d'un entraînement trop chargé.", t:false, e:"La charge compte, mais le stress, la distraction, un sommeil irrégulier ou une poussée de croissance jouent aussi."},
  {id:"m7", q:"Un·e athlète doit tout encaisser sans montrer de faiblesse.", t:false, e:"Taire sa fatigue ou sa douleur n'améliore pas la performance. Dire ses limites permet à ton coach d'adapter la séance."},
  {id:"m8", q:"Le stress des examens peut changer ta façon d'encaisser une séance.", t:true, e:"Ce que tu vis en dehors du sport pèse sur ta charge ressentie. La même séance peut sembler plus dure certains jours."},
  {id:"m9", q:"S'entraîner plus vaut toujours mieux que s'entraîner moins.", t:false, e:"Des charges modérées avec une vraie récupération sont souvent plus efficaces que des charges élevées, surtout à l'adolescence."}
];
const BADGES = [
  {id:"first", n:"Premier pas", d:"Faire son premier check-in", f:(a,s)=>s.checks>=1},
  {id:"s7", n:"Semaine pleine", d:"7 jours de série", f:(a,s)=>s.best>=7},
  {id:"s30", n:"Régularité", d:"30 jours de série", f:(a,s)=>s.best>=30},
  {id:"rest", n:"Repos assumé", d:"Noter un jour de repos", f:(a,s)=>s.rest>=1},
  {id:"multi", n:"Multisport", d:"Noter une séance d'un autre sport", f:(a,s)=>s.cross>=1},
  {id:"talk", n:"Parole ouverte", d:"Demander à parler à son coach", f:(a,s)=>s.talk>=1},
  {id:"full", n:"Tout dit", d:"Check-in et séance le même jour, 10 fois", f:(a,s)=>s.both>=10},
  {id:"myth", n:"Chasse aux mythes", d:"Répondre aux 9 cartes mythe ou réalité", f:(a,s)=>s.quiz>=MYTHS.length}
];

/* ---------- Calculs ---------- */
const dayOf = (a,k) => (a.days && a.days[k]) || null;
const hasC = (a,k) => !!(dayOf(a,k) && dayOf(a,k).c);
function hooper(c){ if(!c) return null; let s=0; for(const h of HOOPER){ if(typeof c[h.k]!=="number") return null; s+=c[h.k]; } return s; }
function load(a,k){ const d=dayOf(a,k); if(!d||!d.s) return 0; return d.s.reduce((t,x)=>t+(x.ty==="rest"?0:(x.rpe||0)*(x.dur||0)),0); }
function sumLoad(a,end,n){ let t=0; for(let i=0;i<n;i++) t+=load(a,addDays(end,-i)); return t; }
function firstDay(a){ const ks=Object.keys(a.days||{}).sort(); return ks[0]||null; }
function acwr(a,end){ const f=firstDay(a); if(!f||f>addDays(end,-20)) return null; const ch=sumLoad(a,end,28)/4; if(ch<=0) return null; return sumLoad(a,end,7)/ch; }
function hooperMean(a,end){ const v=[]; for(let i=1;i<=28;i++){ const d=dayOf(a,addDays(end,-i)); const h=d&&hooper(d.c); if(h!=null) v.push(h); } return v.length>=5 ? v.reduce((x,y)=>x+y,0)/v.length : null; }
function streakFrom(a,k){ let n=0, since=99, bridged=false;
  for(let i=0;i<800;i++){ if(hasC(a,k)){ n++; since++; bridged=false; } else if(since>=6 && n>0 && !bridged){ bridged=true; since=0; } else break; k=addDays(k,-1); }
  return n; }
function streak(a,T){ return streakFrom(a, hasC(a,T) ? T : addDays(T,-1)); }
function stats(a,T){ const s={checks:0,rest:0,cross:0,talk:0,both:0,sess:0,quiz:Object.keys(a.quiz||{}).length,weeks:{},full:0,xp:0};
  for(const k of Object.keys(a.days||{})){ const d=a.days[k]; let ns=0;
    if(d.c){ s.checks++; s.xp+=10; if(d.c.talk) s.talk++; const m=monday(k); s.weeks[m]=(s.weeks[m]||0)+1; }
    for(const x of (d.s||[])){ ns++; if(x.ty==="rest") s.rest++; if(x.ty==="cross") s.cross++; }
    s.sess+=ns; s.xp+=Math.min(2,ns)*10; if(d.c&&ns) s.both++; }
  for(const m in s.weeks) if(s.weeks[m]>=7) s.full++;
  s.xp+=s.quiz*5+s.full*30; s.cur=streak(a,T); s.best=Math.max(s.cur, a.best||0);
  let li=0; LEVELS.forEach((l,i)=>{ if(s.xp>=l[0]) li=i; }); s.li=li; s.lname=LEVELS[li][1];
  s.next=LEVELS[li+1]?LEVELS[li+1][0]:null; s.prev=LEVELS[li][0];
  return s; }
function weekChecks(a,T){ let n=0, k=monday(T); while(k<=T){ if(hasC(a,k)) n++; k=addDays(k,1); } return n; }
function lastCheck(a,T){ for(let i=0;i<60;i++){ const k=addDays(T,-i); if(hasC(a,k)) return {k,i}; } return null; }
function recentPain(a,T){ let p=null; for(let i=0;i<2;i++){ const d=dayOf(a,addDays(T,-i)); if(!d) continue; if(d.c&&typeof d.c.pain==="number") p=Math.max(p||0,d.c.pain); for(const x of (d.s||[])) if(typeof x.pain==="number") p=Math.max(p||0,x.pain); } return p; }
function flags(a,T){ const f=[]; const lc=lastCheck(a,T);
  const p=recentPain(a,T); if(p!=null&&p>3) f.push({lv:"crit",t:"Douleur "+p+"/10",w:"Au-delà de 3 sur 10 pendant l'effort, le guide recommande d'adapter ou d'arrêter la séance. Si la douleur persiste ou s'intensifie, orientez vers un·e professionnel·le de santé."});
  const r=acwr(a,T);
  if(r!=null&&r>=1.5) f.push({lv:"crit",t:"Ratio "+fr2(r),w:"La charge des 7 derniers jours dépasse nettement l'habitude des 4 dernières semaines. À partir de 1,50, le risque de blessure est décrit comme accru."});
  else if(r!=null&&r>1.3) f.push({lv:"warn",t:"Ratio "+fr2(r),w:"Au-dessus de la zone 0,80 à 1,30. Une compétition ou un stage peut l'expliquer : c'est un repère, pas une règle."});
  else if(r!=null&&r<0.8&&!(lc&&lc.i>=5)) f.push({lv:"info",t:"Ratio "+fr2(r),w:"Charge en baisse par rapport à l'habitude : repos prévu, reprise, maladie ?"});
  if(lc&&lc.i<=1&&dayOf(a,lc.k).c.talk) f.push({lv:"warn",t:"Souhaite en parler",w:"L'athlète a coché « J'aimerais en parler ». Prenez un moment avant la séance."});
  if(lc&&lc.i===0){ const h=hooper(dayOf(a,T).c), m=hooperMean(a,T); if(h!=null&&m!=null&&h>=m+3) f.push({lv:"warn",t:"Moins bien que d'habitude",w:"Indice de Hooper à "+h+" pour une moyenne personnelle de "+fr(m)+". Demandez comment ça va et adaptez la séance au besoin."}); }
  let hf=0, nc=0; for(let i=0;i<7;i++){ const d=dayOf(a,addDays(T,-i)); if(d&&d.c&&typeof d.c.fa==="number"){ nc++; if(d.c.fa>=5) hf++; } }
  if(hf>=5) f.push({lv:"warn",t:"Fatigue élevée qui dure",w:"Fatigue notée à 5 ou plus sur 7 lors de "+hf+" des 7 derniers jours. Une fatigue qui s'installe demande plus de récupération."});
  if(lc&&lc.i>=5) f.push({lv:"info",t:"Silence depuis "+lc.i+" jours",w:"Plus de check-in récemment. Un désengagement peut être un signe de baisse de motivation : prenez des nouvelles, sans pression."});
  return f; }
const LV = {crit:3,warn:2,info:1};
const sev = fl => fl.reduce((m,x)=>Math.max(m,LV[x.lv]),0);

const blank = () => ({nick:"",sport:"",consentAt:null,days:{},quiz:{},best:0,v:1});
function normalize(o){ const b=blank(); if(!o||typeof o!=="object") return b; return Object.assign(b,o,{days:o.days&&typeof o.days==="object"?o.days:{},quiz:o.quiz&&typeof o.quiz==="object"?o.quiz:{}}); }
let me = blank();
try{ const raw=localStorage.getItem("tempo.me"); if(raw) me=normalize(JSON.parse(raw)); }catch(e){}
const ctx = {mode:"boot",db:null,user:null,uid:null,canEdit:false,view:"aujourdhui",team:{name:"",goal:0},pulse:[],athletes:null,names:{},sel:null,stale:false,saveErr:false,readonly:false,askDel:false};
const draft = {date:today(), c:{}, editC:false, s:newSess(), nick:me.nick, sport:me.sport, ok:false, quiz:null, tname:null, tgoal:null};
function newSess(){ return {ty:"train",dur:60,rpe:null,fun:null,men:null,pain:null}; }
const ROUTES = {aujourdhui:1,progres:1,coach:1};
function readHash(){ const h=location.hash.replace("#",""); if(ROUTES[h]) ctx.view=h; }

/* ---------- Données ---------- */
const use = n => (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
let saving=false, dirty=false, lastPulse="";
async function persist(){
  const s=stats(me,today()); if(s.cur>(me.best||0)) me.best=s.cur;
  try{ localStorage.setItem("tempo.me",JSON.stringify(me)); }catch(e){}
  if(ctx.mode!=="cloud") return;
  dirty=true; if(saving) return; saving=true;
  while(dirty){ dirty=false;
    try{ await ctx.db.doc("athletes/"+ctx.uid).set(clone(me)); ctx.saveErr=false; }
    catch(e){ if(e&&e.code==="invalid_argument"){ ctx.mode="local"; ctx.readonly=true; } else ctx.saveErr=true; saving=false; render(); return; } }
  saving=false; syncPulse();
}
async function syncPulse(){ if(ctx.mode!=="cloud"||!me.consentAt) return; const w=monday(today()), n=weekChecks(me,today()), sig=w+":"+n; if(sig===lastPulse) return; lastPulse=sig;
  try{ await ctx.db.doc("pulse/"+ctx.uid).set({w,n}); }catch(e){} }
function subscribe(){
  const db=ctx.db; let first=true, migrated=false;
  db.doc("athletes/"+ctx.uid).onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return; if(saving||dirty) return;
    if(snap.exists){ me=normalize(clone(snap.data())); if(first){ draft.nick=me.nick; draft.sport=me.sport; } try{ localStorage.setItem("tempo.me",JSON.stringify(me)); }catch(e){} render(); syncPulse(); }
    else if(!migrated&&!(snap.metadata&&snap.metadata.fromCache)&&me.consentAt){ migrated=true; persist(); }
    first=false;
  },()=>{});
  db.doc("team/main").onSnapshot(snap=>{ ctx.team=snap.exists?Object.assign({name:"",goal:0},snap.data()):{name:"",goal:0}; render(); },()=>{});
  db.collection("pulse").onSnapshot(q=>{ ctx.pulse=q.docs.map(d=>d.data()); render(); },()=>{});
  if(ctx.canEdit){
    const timer=setTimeout(()=>{ ctx.stale=true; render(); },10000);
    db.collection("athletes").onSnapshot(async q=>{ clearTimeout(timer); ctx.stale=false;
      ctx.athletes=q.docs.map(d=>Object.assign({id:d.id},normalize(clone(d.data())))).filter(a=>a.consentAt);
      if(ctx.user){ try{ const ps=await ctx.user.profiles(ctx.athletes.map(a=>a.id)); for(const id in ps) ctx.names[id]=ps[id].name||""; }catch(e){} }
      render(); },()=>{ clearTimeout(timer); ctx.stale=true; render(); });
  }
}
async function boot(){
  const [db,user]=await Promise.all([use("db"),use("user")]);
  let uid=null, can=false;
  if(user){ try{ uid=await user.id(); can=await user.canEdit(); }catch(e){} }
  ctx.user=user; ctx.canEdit=!!can;
  if(db&&uid){ ctx.mode="cloud"; ctx.db=db; ctx.uid=uid; subscribe(); } else ctx.mode="local";
  if(ctx.canEdit&&!location.hash) ctx.view="coach";
  render();
}

/* ---------- Exemples (vue coach sans athlète réel) ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function demoTeam(){ const T=today();
  const mk=(seed,nick,o)=>{ const r=rng(seed), a=Object.assign(blank(),{id:"demo"+seed,nick,sport:"Athlétisme",consentAt:1,demo:true});
    for(let i=34;i>=0;i--){ if(o.silent&&i<o.silent) continue; const k=addDays(T,-i), wd=toDate(k).getDay(), d={};
      let base=o.base||2.4; if(o.tired&&i<9) base+=2.6; if(o.dip&&i===0) base+=2.4;
      const q=()=>clamp(Math.round(base+(r()-.5)*2),1,7);
      d.c={sl:q(),fa:q(),st:q(),so:q(),mood:clamp(Math.round(6-base+(r()-.5)),1,5),pain:o.pain&&i<2?5:(r()<.12?2:0)};
      if(o.talk&&i===0) d.c.talk=true;
      if(wd===0||wd===4) d.s=[{ty:"rest"}];
      else{ let dur=[60,75,90,60,45][Math.floor(r()*5)], rpe=clamp(Math.round(5+(r()-.5)*3),2,9); if(o.spike&&i<7){ dur=Math.round(dur*1.8); rpe=Math.min(10,rpe+1); }
        d.s=[{ty:wd===3?"cross":"train",dur,rpe,fun:clamp(Math.round(4+(r()-.5)*2),1,5),men:clamp(Math.round(3+(r()-.5)*3),1,5)}]; }
      a.days[k]=d; }
    return a; };
  return [mk(11,"Léa",{}),mk(23,"Noah",{spike:true}),mk(37,"Inès",{pain:true,talk:true}),mk(41,"Tom",{silent:6}),mk(59,"Jade",{tired:true,dip:true})];
}

/* ---------- Rendu : composants ---------- */
function pickHtml(o,val,max){ return '<span class="pe">'+o[0]+"</span>"+esc(o[1])+" <i>"+val+"/"+max+"</i>"; }
function question(g,k,label,min,max,val,hint,rev){ const set=SC[g][k], o=val!=null?set[val-min]:null, pos=val==null?Math.round((min+max)/2):(rev?max+min-val:val);
  const lo=rev?max:min, hi=rev?min:max, L=set[lo-min], R=set[hi-min], hot=k==="pain"&&val>3;
  const end=(v,e)=>'<button type="button" class="end" id="'+g+"-"+k+"-end"+v+'" data-act="set" data-g="'+g+'" data-k="'+k+'" data-v="'+v+'" aria-label="'+esc(e[1])+'" title="'+esc(e[1])+'">'+e[0]+"</button>";
  return '<div class="q"><div class="q-l"><b>'+label+'</b><span class="picked'+(o?"":" none")+'" id="pk-'+g+"-"+k+'">'+(o?pickHtml(o,val,max):(hint||"glisse le curseur"))+'</span></div><div class="sl'+(val==null?" unset":"")+(hot?" hot":"")+'" id="sl-'+g+"-"+k+'">'+end(lo,L)+'<input type="range" id="'+g+"-"+k+'" data-rng="1" data-g="'+g+'" data-k="'+k+'"'+(rev?' data-rev="1"':"")+' min="'+min+'" max="'+max+'" step="1" value="'+pos+'" aria-label="'+esc(label)+'"'+(o?' aria-valuetext="'+esc(o[1])+'"':"")+">"+end(hi,R)+"</div></div>"; }
function chipSet(g,k,opts,val){ return '<div class="chips" role="group">'+opts.map(o=>'<button type="button" class="chip" id="'+g+"-"+k+"-"+o[0]+'" data-act="set" data-g="'+g+'" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+(val===o[0])+'">'+o[1]+"</button>").join("")+"</div>"; }
function pill(lv,t,tip){ return '<span class="pill '+(lv==="info"?"":lv)+'"'+(tip?' data-tip="'+esc(tip)+'"':"")+">"+esc(t)+"</span>"; }

function header(){ const T=today(), s=stats(me,T), coach=ctx.view==="coach";
  let h='<div class="track"><div class="track-in"><div class="top"><div class="brand">Tempo<small>CARNET DE CHARGE</small></div><div class="sp"></div>';
  if(!coach&&me.consentAt) h+='<div class="stat gold" data-tip="Jours de check-in d\'affilée. Un jour manqué par semaine ne casse pas la série."><b>'+s.cur+"</b> jour"+(s.cur>1?"s":"")+' de série</div><div class="stat"><b>'+s.xp+"</b> pts · "+esc(s.lname)+"</div>";
  h+="</div>";
  if(ctx.view==="aujourdhui"&&me.consentAt){ h+='<div class="lanes" aria-label="Les 7 derniers jours">';
    for(let i=6;i>=0;i--){ const k=addDays(T,-i), d=toDate(k), done=hasC(me,k);
      h+='<button type="button" class="lane'+(done?" done":"")+(k===draft.date?" sel":"")+(i===0?" today":"")+'" id="lane-'+i+'" data-act="date" data-k="'+k+'" aria-pressed="'+(k===draft.date)+'" aria-label="'+fmtDay(k)+(done?", check-in fait":", pas de check-in")+'"><span class="d">'+(i===0?"auj.":WD[d.getDay()])+'</span><span class="n">'+d.getDate()+'</span><span class="dot">'+(done?"✓":"")+"</span></button>"; }
    h+="</div>"; }
  const tabs=[["aujourdhui","Aujourd'hui"],["progres","Progrès"]]; if(ctx.canEdit||ctx.mode==="local") tabs.push(["coach",ctx.canEdit?"Coach":"Coach (démo)"]);
  h+='<nav class="tabs">'+tabs.map(t=>'<button type="button" class="tab" id="tab-'+t[0]+'" data-act="nav" data-k="'+t[0]+'"'+(ctx.view===t[0]?' aria-current="page"':"")+">"+t[1]+"</button>").join("")+"</nav></div></div>";
  return h; }

function banners(){ let h="";
  if(ctx.mode==="local"&&ctx.view!=="coach") h+='<div class="note warn"><b>Mode local.</b> Tes réponses restent sur cet appareil et ton coach ne les voit pas. Pour les partager, ouvre la page connecté·e à Claude avec un accès « Contributeur ».</div>';

      else if(h>=m+3){ txt="<b>Moins bien que d'habitude</b> (ta moyenne : "+fr(m)+"). Dis-le à ton coach : adapter la séance aujourd'hui, c'est s'entraîner intelligemment."; cls="warn"; }

function nameOf(a){ return a.nick||ctx.names[a.id]||"Athlète"; }
function spark(a,T){ const n=14, v=[]; for(let i=n-1;i>=0;i--) v.push(load(a,addDays(T,-i))); const mx=Math.max(1,...v), w=150/n; let h='<svg viewBox="0 0 150 36" aria-hidden="true"><line x1="0" y1="35.5" x2="150" y2="35.5" stroke="var(--line)"/>';

function loadChart(a,T){ const n=28, W=560, H=150, L=40, B=20, Tp=10, v=[]; for(let i=n-1;i>=0;i--){ const k=addDays(T,-i); v.push({k,x:load(a,k),d:dayOf(a,k)}); }

  v.forEach((o,i)=>{ const rest=o.d&&o.d.s&&o.d.s.some(s=>s.ty==="rest"), tip=fmtDay(o.k)+" : "+(o.x>0?fr(o.x)+" UA":rest?"repos":"rien de noté");
    if(o.x>0) h+='<rect x="'+(L+i*pw+2)+'" y="'+y(o.x)+'" width="'+(pw-4)+'" height="'+(Tp+ph-y(o.x))+'" rx="2" fill="var(--accent)" opacity="'+(i>=n-7?1:.5)+'"/>';

function hooperChart(a,T){ const n=28, W=560, H=150, L=40, B=20, Tp=10, pw=(W-L)/n, ph=H-B-Tp, y=x=>Tp+ph-((x-4)/24)*ph, pts=[]; let h='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Indice de Hooper sur 28 jours">';

  const m=hooperMean(a,T); if(m!=null) h+='<line x1="'+L+'" x2="'+W+'" y1="'+y(m)+'" y2="'+y(m)+'" stroke="var(--ink-2)" stroke-dasharray="4 4"/><text x="'+(L+4)+'" y="'+(y(m)-4)+'" style="paint-order:stroke;stroke:var(--surface);stroke-width:5px">moyenne perso '+fr(m)+"</text>";

    if(hv!=null){ seg+=(seg?" L":"M")+x+" "+y(hv); pts.push('<circle cx="'+x+'" cy="'+y(hv)+'" r="'+(i===0?5:3.5)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" data-tip="'+esc(fmtDay(k)+" : Hooper "+hv+"/28")+'"/>'); }
    else if(seg){ h+='<path d="'+seg+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'; seg=""; }
    const p=d&&d.c&&d.c.pain; if(typeof p==="number"&&p>3) marks+='<path d="M'+(x-5)+" "+(Tp+ph)+" L"+(x+5)+" "+(Tp+ph)+" L"+x+" "+(Tp+ph-9)+'Z" fill="var(--crit)" data-tip="'+esc(fmtDay(k)+" : douleur "+p+"/10")+'"/>'; }

  el.setAttribute("aria-valuetext",e[1]);
  const b1=document.getElementById("savec"); if(b1&&g==="c") b1.disabled=false;
  const b2=document.getElementById("adds"); if(b2&&g==="s"&&draft.s.ty!=="rest") b2.disabled=!(draft.s.dur>0&&draft.s.rpe!=null); }
document.addEventListener("input",e=>{ if(e.target.dataset&&e.target.dataset.rng) applyRange(e.target); });
document.addEventListener("click",e=>{ if(e.target.dataset&&e.target.dataset.rng) applyRange(e.target); });
const tip=document.getElementById("tip");
function showTip(e){ const el=e.target.closest&&e.target.closest("[data-tip]"); if(!el){ tip.style.display="none"; return; } tip.textContent=el.dataset.tip; tip.style.display="block"; const w=tip.offsetWidth; tip.style.left=clamp(e.clientX-w/2,8,window.innerWidth-w-8)+"px"; tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-12)+"px"; }
document.addEventListener("pointermove",showTip); document.addEventListener("pointerdown",showTip);
window.addEventListener("hashchange",()=>{ readHash(); render(); });

readHash(); loadDraft(); render(); boot();
</script>
